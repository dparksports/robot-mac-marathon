<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="Robot Mac Marathon: two recording modes compared">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0e1a2f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="780" rx="24" fill="url(#bg)"/>

  <!-- Header -->
  <text x="60" y="66" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" letter-spacing="3" fill="#64748b">ROBOT MAC MARATHON · MACOS · APPLE SILICON</text>
  <text x="60" y="112" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="36" font-weight="700" fill="#f1f5f9">Two Recording Modes</text>
  <text x="60" y="142" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#94a3b8">One Swift codebase, two ways to run it — pick by power budget, not by features.</text>

  <!-- Card 1: Timelapse -->
  <rect x="60" y="176" width="510" height="490" rx="20" fill="#111c30" stroke="#22344f" stroke-width="1.5"/>
  <!-- camera icon -->
  <rect x="88" y="204" width="44" height="44" rx="12" fill="#0c2a44"/>
  <rect x="97" y="218" width="20" height="16" rx="4" fill="#38bdf8"/>
  <path d="M120 221 L131 214 L131 238 L120 231 Z" fill="#38bdf8"/>
  <text x="148" y="233" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">Timelapse</text>
  <rect x="410" y="212" width="132" height="26" rx="13" fill="#0c2a44"/>
  <text x="476" y="229" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" letter-spacing="1.5" fill="#7dd3fc">CONTINUOUS</text>
  <line x1="88" y1="272" x2="542" y2="272" stroke="#22344f"/>

  <circle cx="99" cy="305" r="3.5" fill="#38bdf8"/>
  <text x="118" y="310" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#cbd5e1">Single continuous <tspan font-family="ui-monospace,Menlo,monospace" fill="#7dd3fc">.mov</tspan> — video + audio</text>
  <circle cx="99" cy="349" r="3.5" fill="#38bdf8"/>
  <text x="118" y="354" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#cbd5e1">Hardware-accelerated H.264 encoding</text>
  <circle cx="99" cy="393" r="3.5" fill="#38bdf8"/>
  <text x="118" y="398" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#cbd5e1">Auto-restart loop via <tspan font-family="ui-monospace,Menlo,monospace" fill="#7dd3fc">run_timelapse.sh</tspan></text>
  <circle cx="99" cy="437" r="3.5" fill="#38bdf8"/>
  <text x="118" y="442" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#cbd5e1">Ctrl+C finalizes the moov atom safely</text>
  <circle cx="99" cy="481" r="3.5" fill="#38bdf8"/>
  <text x="118" y="486" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#cbd5e1">Stops gracefully below 5 GB free disk</text>

  <line x1="88" y1="606" x2="542" y2="606" stroke="#22344f"/>
  <text x="88" y="640" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#94a3b8"><tspan font-weight="700" fill="#7dd3fc">Best for:</tspan> dashcam-style continuous capture</text>

  <!-- Card 2: Security -->
  <rect x="630" y="176" width="510" height="490" rx="20" fill="#111c30" stroke="#22344f" stroke-width="1.5"/>
  <!-- mic icon -->
  <rect x="675" y="204" width="44" height="44" rx="12" fill="#0c2f22"/>
  <rect x="692" y="210" width="10" height="18" rx="5" fill="#34d399"/>
  <path d="M688 226 C688 236 697 238 697 238 C697 238 706 236 706 226" stroke="#34d399" stroke-width="2.5" fill="none"/>
  <line x1="697" y1="238" x2="697" y2="244" stroke="#34d399" stroke-width="2.5"/>
  <line x1="691" y1="244" x2="703" y2="244" stroke="#34d399" stroke-width="2.5"/>
  <text x="735" y="233" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">Security</text>
  <rect x="986" y="212" width="126" height="26" rx="13" fill="#0c2f22"/>
  <text x="1049" y="229" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" letter-spacing="1.5" fill="#6ee7b7">5–7 DAY BATTERY</text>
  <line x1="658" y1="272" x2="1112" y2="272" stroke="#22344f"/>

  <circle cx="669" cy="305" r="3.5" fill="#34d399"/>
  <text x="688" y="310" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#cbd5e1">Mic always on at ~0.3 W — camera stays off</text>
  <circle cx="669" cy="349" r="3.5" fill="#34d399"/>
  <text x="688" y="354" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#cbd5e1">Hourly audio chunks → <tspan font-family="ui-monospace,Menlo,monospace" fill="#6ee7b7">audio_*.m4a</tspan></text>
  <circle cx="669" cy="393" r="3.5" fill="#34d399"/>
  <text x="688" y="398" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#cbd5e1">Loud sound → 60 s clip (<tspan font-family="ui-monospace,Menlo,monospace" fill="#6ee7b7">trigger_*.mov</tspan>)</text>
  <circle cx="669" cy="437" r="3.5" fill="#34d399"/>
  <text x="688" y="442" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#cbd5e1">HEVC 500 kbps video · AAC 32 kbps audio</text>
  <circle cx="669" cy="481" r="3.5" fill="#34d399"/>
  <text x="688" y="486" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#cbd5e1">Screen dark · battery logged · stops at 5%</text>

  <line x1="658" y1="606" x2="1112" y2="606" stroke="#22344f"/>
  <text x="658" y="640" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#94a3b8"><tspan font-weight="700" fill="#6ee7b7">Best for:</tspan> unattended multi-day monitoring</text>

  <!-- Footer -->
  <line x1="60" y1="700" x2="1140" y2="700" stroke="#1c2a44"/>
  <text x="600" y="736" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#64748b">macOS 14+ · Apple Silicon · Apache-2.0 · github.com/dparksports/robot-mac-marathon</text>
</svg>
